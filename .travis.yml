    - stage: build
      install: ./setup_linux.sh
      script: ./build.sh
      before_deploy:
        - git config --local user.name "gwsci-machine-user"
        - git config --local user.email "gwsci-github-machine-user@nice-code.co.uk"
        - export TRAVIS_TAG=$(< _version.txt)
        - git tag $TRAVIS_TAG || echo "New tag not created."
      deploy:
        provider: releases
        file: release/*.zip
        edge: true
    - stage: deploy-spike
      name: spike build linux
      language: shell
      script: echo "Hello, Linux!" > release-linux.txt
      before_deploy:
        - git config --local user.name "gwsci-machine-user"
        - git config --local user.email "gwsci-github-machine-user@nice-code.co.uk"
        - export TRAVIS_TAG=$(< _version.txt)
