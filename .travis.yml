language: python

python:
  - "3.13"

jobs:
  allow_failures:
    - name: lint
  include:
    - stage: qc
      name: tests (Linux)
      env:
        - TQDM_DISABLE=true
      install: pip install -r requirements.txt
      before_script: python compile_model.py
      script: coverage run -m unittest discover --durations 10 -s .
      after_success: coverage report -m
    -
      name: tests (Windows)
      os: windows
      language: bash
      install:
        - choco install python313 -yam
        # - python -m pip install --upgrade pip
        # - pip install -r requirements.txt
      # script: coverage run -m unittest discover --durations 10 -s .
      script: py --version && py -3.13 --version
      # after_success: coverage report -m
    -
      name: lint
      install: pip install -r requirements-lint.txt
      script: python -m pylint --extension-pkg-allow-list=swacmod.model --disable=R,C,W --ignore=env,env-lint --generated-member=flopy.mf6.modflow.mfgwfsfr.ModflowGwfsfr.obs --ignored-modules=tqdm,swacmod.model,flopy,psutil,networkx,Cython.Build,h5py,yaml .
    -
      name: dependencies
      install: pip install -r requirements.txt && pip install -r requirements-lint.txt
      script: pip list --outdated
    - stage: build
      install: ./setup_linux.sh
      script: ./build.sh
